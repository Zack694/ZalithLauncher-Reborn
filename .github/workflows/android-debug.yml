name: Android Debug Build

# Builds an unsigned debug APK (arm64) so the built-in recorder feature can be
# tested without release signing secrets. Triggers on the feature branch and PRs.

on:
  push:
    branches: [ "feat/builtin-recorder" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JRE JAR files
        run: ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build debug APK (arm64)
        run: ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-recorder-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
