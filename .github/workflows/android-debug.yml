name: Android Debug Build

# Builds an unsigned debug APK (arm64) so the built-in recorder feature can be
# tested without release signing secrets. Triggers on the feature branch and PRs.

on:
  push:
    branches: [ "feat/builtin-recorder" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point gradle wrapper at Tencent mirror
        # GitHub's release CDN has been returning 504 to Actions runners for
        # github.com/*/releases/download/* — fetch the gradle distribution from
        # the Tencent mirror instead (same file, verified by wrapper sha256 if set)
        run: |
          VER=$(grep -oP 'gradle-\d+(\.\d+)*-bin\.zip' gradle/wrapper/gradle-wrapper.properties | head -1)
          sed -i "s#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/$VER#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JRE JAR files
        run: |
          # Retry: transient 504s from GitHub-hosted artifacts (plugins.gradle.org
          # redirects kotlin-compiler-embeddable to JetBrains' GitHub releases)
          for i in 1 2 3; do
            if ./gradlew jre_lwjgl3glfw:build --no-daemon; then exit 0; fi
            echo "::warning::gradlew attempt $i failed (transient network/CDN 504) — retrying in 60s"
            sleep 60
          done
          echo "All 3 gradle attempts failed"; exit 1

      - name: Build debug APK (arm64)
        run: |
          for i in 1 2 3; do
            if ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon --stacktrace; then exit 0; fi
            echo "::warning::gradlew attempt $i failed (transient network/CDN 504) — retrying in 60s"
            sleep 60
          done
          echo "All 3 gradle attempts failed"; exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-recorder-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
