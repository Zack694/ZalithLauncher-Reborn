name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  BuildRelease:
    # Quoted to prevent syntax errors and removed owner check for your fork
    if: "!startsWith(github.ref, 'refs/pull/') && github.ref_name == 'main'"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Cache ~/.gradle (incl. wrapper dists) so the Gradle zip is not
          # re-downloaded from the GitHub release CDN on every run
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          # Decoding directly into the workspace root
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > $GITHUB_WORKSPACE/release.jks

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          # Retry: the gradle wrapper download occasionally dies with
          # HTTP 504 from the GitHub release CDN (transient infra flake)
          for i in 1 2 3; do
            if ./gradlew jre_lwjgl3glfw:build --no-daemon; then exit 0; fi
            echo "::warning::gradlew attempt $i failed (transient network/CDN 504) — retrying in 60s"
            sleep 60
          done
          echo "All 3 gradle attempts failed"; exit 1

      - name: Build Release ${{ matrix.arch }}
        env:
          MOVTERY_KEYSTORE_PASSWORD: ${{ secrets.MOVTERY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_ALIAS }}
        run: |
          chmod +x gradlew
          # Using absolute path ($GITHUB_WORKSPACE) so Gradle finds the file 100%
          # Retry: wrapper download / dependency fetches can hit transient CDN 504s
          for i in 1 2 3; do
            if ./gradlew ZalithLauncher:assemblerelease -Darch=${{ matrix.arch }} \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
              -Pandroid.injected.signing.store.password=$MOVTERY_KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$MOVTERY_KEYSTORE_PASSWORD; then exit 0; fi
            echo "::warning::gradlew attempt $i failed (transient network/CDN 504) — retrying in 60s"
            sleep 60
          done
          echo "All 3 gradle attempts failed"; exit 1

      - name: Upload Release ${{matrix.arch}}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher(Release) ${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*

  BuildDebug:
    if: "startsWith(github.ref, 'refs/pull/') || github.ref_name != 'main'"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          for i in 1 2 3; do
            if ./gradlew jre_lwjgl3glfw:build --no-daemon; then exit 0; fi
            echo "::warning::gradlew attempt $i failed (transient network/CDN 504) — retrying in 60s"
            sleep 60
          done
          echo "All 3 gradle attempts failed"; exit 1

      - name: Build Debug ${{matrix.arch}}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            if ./gradlew ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }}; then exit 0; fi
            echo "::warning::gradlew attempt $i failed (transient network/CDN 504) — retrying in 60s"
            sleep 60
          done
          echo "All 3 gradle attempts failed"; exit 1

      - name: Upload Debug ${{matrix.arch}}
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher(Debug) ${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*
