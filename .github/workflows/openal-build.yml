name: Build OpenAL tap

on:
  workflow_dispatch:
  push:
    paths:
      - 'openal-tap/**'
      - '.github/workflows/openal-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build OpenAL-soft with RecordZy tap
        env:
          ANDROID_NDK_LATEST_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x openal-tap/build.sh
          ./openal-tap/build.sh

      - name: Commit rebuilt libopenal.so
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ZalithLauncher/src/main/assets/components/*/natives/*/libopenal.so \
                  ZalithLauncher/src/main/jniLibs/*/libopenal.so
          if git diff --cached --quiet; then
            echo "No libopenal.so changes to commit."
          else
            git commit -m "CI: rebuild libopenal.so with RecordZy audio tap"
            git push
          fi

      - name: Upload libopenal.so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libopenal-tap
          path: openal-tap/out/**/libopenal.so
